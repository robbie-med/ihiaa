name: CI

# Cheap checks that need no API keys. They exist because the nightly job broke
# silently for a month: an undefined name in cluster_pearls.py, and a grader
# whose output changed with Python's hash seed, so every run committed noise.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: python3 -m pip install --quiet numpy pyflakes

      - name: Lint (undefined names, unused imports)
        run: python3 -m pyflakes scripts/

      - name: Grader self-test
        run: python3 scripts/score_pearls.py --selftest

      # Rebuild under two different hash seeds. Any diff means either the
      # committed site is stale or some step is nondeterministic.
      - name: Derived data is reproducible and committed
        run: |
          for seed in 1 2; do
            PYTHONHASHSEED=$seed python3 scripts/build_site.py > /dev/null
            PYTHONHASHSEED=$seed python3 scripts/score_pearls.py --apply > /dev/null
            PYTHONHASHSEED=$seed python3 scripts/build_site.py > /dev/null
          done
          git diff --stat --exit-code -- data/episodes site/data.json site/ep

      - name: Site check
        run: python3 scripts/check_site.py
