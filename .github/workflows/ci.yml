name: CI

# Cheap checks that need no API keys. They exist because the nightly job broke
# silently for a month: an undefined name in cluster_pearls.py, and a grader
# whose output changed with Python's hash seed, so every run committed noise.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: python3 -m pip install --quiet numpy pyflakes

      - name: Lint (undefined names, unused imports)
        run: python3 -m pyflakes scripts/

      - name: Self-tests (grader, speaker names, spoken-number check)
        run: |
          python3 scripts/score_pearls.py --selftest
          python3 scripts/speakers.py --selftest
          python3 scripts/refine_pearls.py --selftest

      # Rebuild under two different hash seeds. Any diff means either the
      # committed data is stale or some step is nondeterministic. (Taxonomy and
      # the concept map need the MeSH download, so they are left out here.)
      - name: Derived data is reproducible and committed
        run: |
          for seed in 1 2; do
            export PYTHONHASHSEED=$seed
            python3 scripts/speakers.py > /dev/null
            python3 scripts/find_duplicates.py > /dev/null
            python3 scripts/refine_pearls.py > /dev/null
            python3 scripts/build_site.py > /dev/null
            python3 scripts/score_pearls.py --apply > /dev/null
            python3 scripts/build_site.py > /dev/null
          done
          git diff --stat --exit-code -- data/episodes data/speakers.json site/data.json site/ep

      - name: Site check
        run: python3 scripts/check_site.py
