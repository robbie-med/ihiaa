name: Ingest new lectures

# Polls the feed, processes anything new, rebuilds every derived artifact,
# commits, then deploys. Nothing runs on a local machine.
#
# Run by hand from the Actions tab for maintenance:
#   refresh   rebuild everything and run contradiction detection even with no new
#             lectures (cached; only unseen pearl pairs cost anything, ~cents)
#   reenrich  re-extract pearls with the current prompt: "all" or slugs. Uses the
#             existing transcripts, so no audio or transcription cost; roughly $1
#             for the whole corpus.
on:
  schedule:
    - cron: "17 9 * * *"        # daily 09:17 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new episodes to process this run (0 = all outstanding)"
        default: "0"
      slugs:
        description: "Specific slugs to (re)try ingesting, space separated"
        default: ""
      refresh:
        description: "Rebuild all derived data and run contradiction detection"
        type: boolean
        default: false
      reenrich:
        description: "Re-extract pearls with the current prompt: 'all' or slugs (paid, ~$1 for all)"
        default: ""
      max_pairs:
        description: "Max new pearl pairs to judge for agreement/conflict this run"
        default: "1500"

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python3 -m pip install --quiet numpy

      # Inputs go through env, never straight into the script, so a slug can't
      # inject shell.
      - name: Find outstanding episodes
        id: find
        env:
          SLUGS: ${{ inputs.slugs }}
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          if [ -n "$SLUGS" ]; then
            printf '%s\n' $SLUGS > todo.txt
          else
            python3 scripts/fetch_feed.py "$LIMIT" > todo.txt
          fi
          n=$(grep -c . todo.txt || true)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "--- $n to process ---"; cat todo.txt

      - name: Install ffmpeg
        if: steps.find.outputs.count != '0'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Failures here don't stop the run: episodes that did finish still get
      # built, committed and deployed. The job is marked failed at the end.
      - name: Ingest
        id: ingest
        if: steps.find.outputs.count != '0'
        continue-on-error: true
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          PPQ_API_KEY: ${{ secrets.PPQ_API_KEY }}
        run: xargs -a todo.txt python3 -u scripts/backfill.py --workers 4

      - name: Re-extract pearls
        id: reenrich
        if: inputs.reenrich != ''
        continue-on-error: true
        env:
          PPQ_API_KEY: ${{ secrets.PPQ_API_KEY }}
          REENRICH: ${{ inputs.reenrich }}
        run: python3 -u scripts/backfill.py --reenrich --workers 4 $REENRICH

      - name: Decide what to rebuild
        id: done
        env:
          REFRESH: ${{ inputs.refresh }}
          REENRICH: ${{ inputs.reenrich }}
        run: |
          n=0
          if [ -s todo.txt ]; then
            n=$(python3 - <<'EOF'
          import json, pathlib
          slugs = pathlib.Path("todo.txt").read_text().split()
          eps = pathlib.Path("data/episodes")
          print(sum(1 for s in slugs if (eps / f"{s}.json").exists()
                    and json.loads((eps / f"{s}.json").read_text()).get("chunks")))
          EOF
            )
          fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -gt 0 ] || [ "$REFRESH" = "true" ] || [ -n "$REENRICH" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi
          echo "$n new lecture(s) fully processed; rebuild=$([ "$n" -gt 0 ] || [ "$REFRESH" = "true" ] || [ -n "$REENRICH" ] && echo yes || echo no)"

      # Everything below is derived from data/episodes/*.json and only needs to
      # run when the corpus changed or a refresh was asked for.
      - name: Cache MeSH
        if: steps.done.outputs.rebuild == 'true'
        id: meshcache
        uses: actions/cache@v4
        with:
          path: data/ref/mesh.bin
          key: mesh-d2025

      - name: Download MeSH
        if: steps.done.outputs.rebuild == 'true' && steps.meshcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/ref
          curl -sSL --max-time 900 \
            "https://nlmpubs.nlm.nih.gov/projects/mesh/2025/asciimesh/d2025.bin" \
            -o data/ref/mesh.bin
          test "$(stat -c%s data/ref/mesh.bin)" -gt 1000000

      - name: Rebuild speakers, pearls, grades, site, taxonomy, concept map
        if: steps.done.outputs.rebuild == 'true'
        run: ./scripts/rebuild.sh

      # Embeddings and every judge/verify verdict are cached by pearl text, so a
      # run only pays for pairs it has never seen.
      - name: Restore agreement/conflict cache
        if: steps.done.outputs.rebuild == 'true'
        uses: actions/cache@v4
        with:
          path: |
            data/cache/pearl_vecs_by_text.json
            data/cache/judge_*.json
            data/cache/verify_*.json
          key: relate-cache-${{ github.run_id }}
          restore-keys: relate-cache-

      - name: Find agreement and conflicts
        id: cluster
        if: steps.done.outputs.rebuild == 'true'
        continue-on-error: true          # enrichment, not critical path
        env:
          PPQ_API_KEY: ${{ secrets.PPQ_API_KEY }}
          MAX_PAIRS: ${{ inputs.max_pairs || '1500' }}
        run: |
          python3 scripts/cluster_pearls.py --max-new "$MAX_PAIRS"
          python3 scripts/build_site.py   # fold fresh results into data.json

      # Translation (ko/fr/de) is built but deliberately OFF.
      # Set repo variable RUN_TRANSLATE=1 to enable.
      - name: Translate
        id: translate
        if: steps.done.outputs.rebuild == 'true' && vars.RUN_TRANSLATE == '1'
        continue-on-error: true
        env:
          PPQ_API_KEY: ${{ secrets.PPQ_API_KEY }}
        run: |
          python3 -u scripts/translate.py
          python3 scripts/build_site.py

      - name: Check site
        if: steps.done.outputs.rebuild == 'true'
        run: python3 scripts/check_site.py

      # Commits partial progress too: pipeline stages are cached per episode, so
      # a half-finished episode resumes next run instead of paying again.
      - name: Commit
        if: steps.find.outputs.count != '0' || steps.done.outputs.rebuild == 'true'
        env:
          N: ${{ steps.done.outputs.count }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Audio is never committed (~2.5GB at full corpus); timestamps deep-link
          # to Podbean instead.
          git add data/episodes data/episodes_meta.json data/taxonomy.json \
                  data/clusters.json data/speakers.json site
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          if [ "${N:-0}" -gt 0 ]; then
            msg="ingest: $N new lecture(s) [skip ci]"
          elif [ -s todo.txt ]; then
            msg="ingest: partial progress, no lecture finished [skip ci]"
          else
            msg="refresh: rebuild derived data [skip ci]"
          fi
          git commit -m "$msg"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report failures
        if: steps.ingest.outcome == 'failure' || steps.reenrich.outcome == 'failure' || steps.cluster.outcome == 'failure' || steps.translate.outcome == 'failure'
        run: |
          [ "${{ steps.ingest.outcome }}" = failure ]    && echo "::error::Some episodes failed to ingest; see the Ingest step."
          [ "${{ steps.reenrich.outcome }}" = failure ]  && echo "::error::Some lectures failed to re-extract; see that step."
          [ "${{ steps.cluster.outcome }}" = failure ]   && echo "::error::Agreement/conflict detection failed; that view on the site is stale."
          [ "${{ steps.translate.outcome }}" = failure ] && echo "::error::Translation failed."
          exit 1

  # Always publish, even when nothing new was found or ingest partly failed:
  # deploying is idempotent, and it lets a previously failed deploy self-heal.
  deploy:
    needs: ingest
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
