name: Ingest new lectures

# Nothing runs on the user's PC. The feed is polled weekly here; new episodes are
# downloaded, transcribed, enriched and committed back, and Pages redeploys.
on:
  schedule:
    - cron: "0 9 * * 1"        # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Max episodes to process this run (0 = all outstanding)"
        default: "5"
      slugs:
        description: "Specific slugs to (re)process, space separated"
        default: ""

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    # A large backfill is many hours of download + API time; keep headroom and
    # rely on the run being resumable (finished episodes are skipped).
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Find new episodes
        id: find
        run: |
          if [ -n "${{ github.event.inputs.slugs }}" ]; then
            echo "${{ github.event.inputs.slugs }}" | tr ' ' '\n' > todo.txt
          else
            python3 scripts/fetch_feed.py "${{ github.event.inputs.limit || 5 }}" > todo.txt
          fi
          echo "count=$(wc -l < todo.txt)" >> "$GITHUB_OUTPUT"
          echo "--- to process ---"; cat todo.txt

      - name: Ingest
        if: steps.find.outputs.count != '0'
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          PPQ_API_KEY: ${{ secrets.PPQ_API_KEY }}
        run: xargs -a todo.txt python3 -u scripts/ingest.py

      # Translation (ko/fr/de) is built and working but deliberately OFF.
      # Re-enable by setting the repo variable RUN_TRANSLATE to "1".
      - name: Translate (ko/fr/de)
        if: steps.find.outputs.count != '0' && vars.RUN_TRANSLATE == '1'
        env:
          PPQ_API_KEY: ${{ secrets.PPQ_API_KEY }}
        continue-on-error: true
        run: python3 -u scripts/translate.py

      - name: Build site
        run: python3 scripts/build_site.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Audio is intentionally not committed: ~1.5GB at full corpus, well
          # past what belongs in git. Timestamps deep-link to Podbean instead.
          git add data/episodes data/episodes_meta.json data/clusters.json site
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "ingest: $(wc -l < todo.txt) episode(s) [skip ci]"
            git push
          fi
