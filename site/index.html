<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HPI Lecture Corpus</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="theme-color" content="#f8f8f8">
<meta name="description" content="Searchable, cross-linked archive of Hope Partnerships International residency lectures.">
<style>
  /* Bootstrap 3 + bootstrap-theme (2015), hand-written. What dates a page is the
     vertical gradients, inset white highlights, 4px radii, dense 14px type and
     blue #337ab7 links. A flat, airy layout reads 2017+ whatever the palette. */
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:#fff;color:#333;
       font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
       font-size:14px;line-height:1.428571429}
  a{color:#337ab7;text-decoration:none}
  a:hover,a:focus{color:#23527c;text-decoration:underline}
  h1,h2,h3,h4{font-weight:500;line-height:1.1;color:inherit}
  h1{font-size:36px;margin:20px 0 10px}
  h2{font-size:26px;margin:4px 0 6px}
  h3{font-size:20px;margin:22px 0 10px}
  h4{font-size:16px;margin:0}
  small,.small{font-size:85%}
  .muted{color:#777}
  .container{max-width:1170px;margin:0 auto;padding:0 15px}
  code{padding:2px 4px;font-size:90%;color:#c7254e;background:#f9f2f4;border-radius:4px}
  [hidden]{display:none!important}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

  /* ---- navbar-default, bootstrap-theme ---- */
  .navbar{background-image:linear-gradient(to bottom,#fff 0,#f8f8f8 100%);
          border-bottom:1px solid #e7e7e7;
          box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 1px 5px rgba(0,0,0,.075)}
  .navbar .container{display:flex;align-items:center;flex-wrap:wrap;gap:0 6px;min-height:50px}
  .brand{display:flex;align-items:center;gap:8px;font-size:18px;color:#777;
         padding:13px 10px 13px 0;text-shadow:0 1px 0 rgba(255,255,255,.25);white-space:nowrap}
  .brand:hover,.brand:focus{color:#5e5e5e;text-decoration:none}
  .brand img{width:22px;height:22px;border-radius:5px}
  .nav{display:flex;flex-wrap:wrap;list-style:none;margin:0;padding:0}
  .nav a{display:block;padding:15px 11px;color:#777;text-shadow:0 1px 0 rgba(255,255,255,.25)}
  .nav a:hover,.nav a:focus{color:#333;text-decoration:none;background:transparent}
  .nav a.on{color:#555;background-image:linear-gradient(to bottom,#dbdbdb 0,#e2e2e2 100%);
            box-shadow:inset 0 3px 9px rgba(0,0,0,.075)}
  .navsearch{margin-left:auto;display:flex;gap:6px;align-items:center;padding:8px 0}

  /* ---- forms & buttons ---- */
  .form-control{display:block;width:100%;height:34px;padding:6px 12px;font-size:14px;
        line-height:1.428571429;color:#555;background:#fff;border:1px solid #ccc;border-radius:4px;
        box-shadow:inset 0 1px 1px rgba(0,0,0,.075);font-family:inherit;
        transition:border-color .15s ease-in-out,box-shadow .15s ease-in-out}
  .form-control:focus{border-color:#66afe9;outline:0;
        box-shadow:inset 0 1px 1px rgba(0,0,0,.075),0 0 8px rgba(102,175,233,.6)}
  .input-lg{height:46px;padding:10px 16px;font-size:18px;border-radius:6px}
  #q{width:250px}
  .btn{display:inline-block;padding:6px 12px;font-size:14px;line-height:1.428571429;
       border:1px solid transparent;border-radius:4px;cursor:pointer;font-family:inherit;
       white-space:nowrap;vertical-align:middle;user-select:none;
       text-shadow:0 -1px 0 rgba(0,0,0,.2);
       box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 1px 1px rgba(0,0,0,.075)}
  .btn:hover,.btn:focus{text-decoration:none}
  .btn:active,.btn.on{box-shadow:inset 0 3px 5px rgba(0,0,0,.125)}
  .btn-default{color:#333;text-shadow:0 1px 0 #fff;border-color:#ccc;
       background-image:linear-gradient(to bottom,#fff 0,#e0e0e0 100%)}
  .btn-default:hover,.btn-default:focus{color:#333;background:#e0e0e0;border-color:#adadad}
  .btn-default.on{background:#e0e0e0;border-color:#dbdbdb;color:#333}
  .btn-primary{color:#fff;border-color:#245580;
       background-image:linear-gradient(to bottom,#337ab7 0,#265a88 100%)}
  .btn-primary:hover,.btn-primary:focus{color:#fff;background:#265a88}
  .btn-sm{padding:5px 10px;font-size:12px;line-height:1.5;border-radius:3px}
  .btn-xs{padding:1px 5px;font-size:12px;line-height:1.5;border-radius:3px}
  .btn-lg{padding:10px 16px;font-size:18px;border-radius:6px}
  .btn-block{display:block;width:100%}
  .btn-group{display:inline-flex;flex-wrap:wrap;vertical-align:middle}
  .btn-group .btn{border-radius:0;margin-left:-1px}
  .btn-group .btn:first-child{border-radius:4px 0 0 4px;margin-left:0}
  .btn-group .btn:last-child{border-radius:0 4px 4px 0}
  .btn-group .btn.btn-sm:first-child{border-radius:3px 0 0 3px}
  .btn-group .btn.btn-sm:last-child{border-radius:0 3px 3px 0}
  select.form-control{width:auto;display:inline-block;cursor:pointer}

  /* ---- alerts ---- */
  .alert{padding:12px 15px;margin-bottom:18px;border:1px solid transparent;border-radius:4px;
         text-shadow:0 1px 0 rgba(255,255,255,.2);
         box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 2px rgba(0,0,0,.05)}
  .alert-danger{color:#a94442;border-color:#dca7a7;
         background-image:linear-gradient(to bottom,#f2dede 0,#e7c3c3 100%)}
  .alert-warning{color:#8a6d3b;border-color:#f5e79e;
         background-image:linear-gradient(to bottom,#fcf8e3 0,#f8efc0 100%)}
  .alert-info{color:#31708f;border-color:#9acfea;
         background-image:linear-gradient(to bottom,#d9edf7 0,#b9def0 100%)}
  .alert a{font-weight:700;color:inherit;text-decoration:underline}
  .alert .close{float:right;margin-left:10px;font-size:21px;font-weight:700;line-height:1;
         color:#000;opacity:.2;cursor:pointer;background:none;border:0;padding:0;
         text-shadow:0 1px 0 #fff}
  .alert .close:hover{opacity:.5}
  .notice{margin:0;border-radius:0;border-width:0 0 1px;padding:7px 0;font-size:13px}

  /* ---- breadcrumb ---- */
  .breadcrumb{padding:8px 15px;margin:18px 0 18px;list-style:none;border-radius:4px;
         background-image:linear-gradient(to bottom,#f5f5f5 0,#e8e8e8 100%);
         box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 2px rgba(0,0,0,.05);
         display:flex;flex-wrap:wrap;gap:0;font-size:13px}
  .breadcrumb li+li:before{content:"/\00a0";padding:0 5px;color:#ccc}
  .breadcrumb .active{color:#777}

  /* ---- panels ---- */
  .panel{background:#fff;border:1px solid #ddd;border-radius:4px;margin-bottom:18px;
         box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .panel-heading{padding:10px 15px;border-bottom:1px solid #ddd;border-radius:3px 3px 0 0;
         color:#333;background-image:linear-gradient(to bottom,#f5f5f5 0,#e8e8e8 100%)}
  .panel-heading h4{display:flex;align-items:center;gap:8px}
  .panel-primary{border-color:#337ab7}
  .panel-primary>.panel-heading{color:#fff;border-color:#2e6da4;
         background-image:linear-gradient(to bottom,#337ab7 0,#2e6da4 100%)}
  .panel-danger{border-color:#ebccd1}
  .panel-danger>.panel-heading{color:#a94442;border-color:#ebccd1;
         background-image:linear-gradient(to bottom,#f2dede 0,#ebcccc 100%)}
  .panel-body{padding:15px}
  .panel-body>p:first-child{margin-top:0}
  .panel-footer{padding:10px 15px;background:#f5f5f5;border-top:1px solid #ddd;
         border-radius:0 0 3px 3px;font-size:13px}
  .toggle-head{cursor:pointer;user-select:none}
  .toggle-head:hover{background-image:linear-gradient(to bottom,#e8e8e8 0,#dcdcdc 100%)}
  .caret{display:inline-block;width:10px;color:#777;font-size:11px}

  /* ---- list group ---- */
  .list-group{padding:0;margin:0 0 18px;border-radius:4px;
         box-shadow:0 1px 2px rgba(0,0,0,.075)}
  .list-group-item{position:relative;display:block;padding:9px 15px;margin-bottom:-1px;
         background:#fff;border:1px solid #ddd;color:#555}
  .list-group-item:first-child{border-top-left-radius:4px;border-top-right-radius:4px}
  .list-group-item:last-child{margin-bottom:0;border-bottom-left-radius:4px;border-bottom-right-radius:4px}
  a.list-group-item:hover,a.list-group-item:focus{background:#f5f5f5;text-decoration:none;color:#555}
  a.list-group-item.active{z-index:2;color:#fff;border-color:#2b669a;text-shadow:0 -1px 0 #286090;
         background-image:linear-gradient(to bottom,#337ab7 0,#2b669a 100%)}
  a.list-group-item.active .badge{color:#337ab7;background:#fff}
  .list-group-item .badge{float:right;margin-left:6px}
  .lg-title{color:#337ab7}
  a.list-group-item:hover .lg-title{color:#23527c;text-decoration:underline}

  /* ---- badges & labels ---- */
  .badge{display:inline-block;min-width:10px;padding:3px 7px;font-size:12px;font-weight:700;
         line-height:1;color:#fff;text-align:center;white-space:nowrap;vertical-align:middle;
         background:#777;border-radius:10px}
  .label{display:inline-block;padding:.2em .6em .3em;font-size:75%;font-weight:700;line-height:1;
         color:#fff;text-align:center;white-space:nowrap;vertical-align:baseline;border-radius:.25em}
  .label-default{background:#777}.label-primary{background:#337ab7}
  .label-success{background:#5cb85c}.label-info{background:#5bc0de}
  .label-warning{background:#f0ad4e}.label-danger{background:#d9534f}
  a.label:hover{color:#fff;text-decoration:none;opacity:.85}

  /* ---- jumbotron & thumbnails ---- */
  .jumbotron{padding:30px 36px;margin:20px 0 20px;background:#eee;border-radius:6px;
         background-image:linear-gradient(to bottom,#e8e8e8 0,#f5f5f5 100%);
         box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 2px rgba(0,0,0,.05)}
  .jumbotron h1{margin-top:0;font-size:42px}
  .jumbotron .lead{font-size:19px;font-weight:300;margin:0 0 20px;max-width:760px}
  .jsearch{display:flex;gap:8px;max-width:640px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}
  .thumb{display:block;padding:14px;border:1px solid #ddd;border-radius:4px;background:#fff;
         text-align:center;color:#333;box-shadow:0 1px 2px rgba(0,0,0,.075)}
  a.thumb:hover{border-color:#337ab7;text-decoration:none;color:#333}
  .thumb b{display:block;font-size:30px;font-weight:300;color:#337ab7;line-height:1.2}
  .thumb.danger b{color:#d9534f}

  /* ---- layout ---- */
  .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  .vs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:14px}
  .vs .pearl{margin:0;height:100%}
  h5.sub{margin:6px 0 10px;font-size:12px;text-transform:uppercase;color:#777;letter-spacing:.04em}
  .side{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
  .side-r{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
  .cols{column-count:3;column-gap:20px}
  .cols .list-group-item{break-inside:avoid}
  .well{min-height:20px;padding:15px;margin-bottom:18px;border:1px solid #dcdcdc;border-radius:4px;
        background-image:linear-gradient(to bottom,#e8e8e8 0,#f5f5f5 100%);
        box-shadow:inset 0 1px 3px rgba(0,0,0,.05),0 1px 0 rgba(255,255,255,.1)}
  .well h5{margin:0 0 8px;font-size:12px;text-transform:uppercase;color:#777;letter-spacing:.04em}
  .well .list-group{margin-bottom:14px}
  .well .list-group-item{padding:6px 12px;font-size:13px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
  .toolbar .grow{flex:1}

  /* ---- pearls ---- */
  .pearl{padding:12px 15px;border:1px solid #ddd;border-radius:4px;margin-bottom:10px;
         background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.05)}
  .pearl:target,.pearl.flash{animation:fl 2s ease-out}
  .pearl .txt{margin:6px 0 4px;font-size:15px;line-height:1.45}
  .meta{color:#777;font-size:12px}
  .meta a{color:#337ab7}
  .ts{font-weight:700;white-space:nowrap}
  .ts:before{content:"\25B6\00a0";font-size:9px;vertical-align:1px}
  .quote{border-left:5px solid #eee;padding:8px 16px;margin:8px 0 0;color:#666;
         font-size:13px;font-style:italic;display:none}
  .quote.show{display:block}
  .linkish{color:#337ab7;cursor:pointer;background:none;border:0;padding:0;font:inherit;font-size:12px}
  .linkish:hover{color:#23527c;text-decoration:underline}
  mark{background:#fcf8e3;padding:0 1px}

  /* ---- tables ---- */
  table{width:100%;max-width:100%;border-collapse:collapse;margin-bottom:18px;font-size:13px}
  th{text-align:left;padding:8px;border-bottom:2px solid #ddd;vertical-align:bottom;white-space:nowrap}
  th a{color:#333}
  th a.on{color:#337ab7}
  td{padding:8px;border-top:1px solid #ddd;vertical-align:top}
  .table-striped tbody tr:nth-child(odd){background:#f9f9f9}
  .table-hover tbody tr:hover{background:#f5f5f5}
  td.num,th.num{text-align:right;white-space:nowrap}
  td.nw{white-space:nowrap}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .table-bordered{border:1px solid #ddd}
  tr.hit{background:#fcf8e3!important}

  /* ---- calendar ---- */
  .cal{margin:0;font-size:12px}
  .cal th{text-align:center;padding:4px;color:#777;border-bottom:1px solid #ddd}
  .cal td{text-align:center;padding:4px;border-top:1px solid #eee;width:14.28%}
  .cal td.nil{color:#bbb}
  .cal td.has a{display:block;font-weight:700;border-radius:3px;color:#fff;
         background-image:linear-gradient(to bottom,#337ab7 0,#265a88 100%)}
  .cal td.has a:hover{text-decoration:none;opacity:.85}
  .cal td.sel a{background:#f0ad4e}
  .calhead{display:flex;align-items:center;gap:4px;margin-bottom:6px}
  .calhead b{flex:1;text-align:center}

  /* ---- pagination / pager ---- */
  .pagination{display:flex;flex-wrap:wrap;padding:0;margin:0 0 16px;list-style:none;border-radius:4px}
  .pagination a{display:block;padding:5px 10px;margin-left:-1px;font-size:13px;color:#337ab7;
         background:#fff;border:1px solid #ddd}
  .pagination li:first-child a{margin-left:0;border-radius:4px 0 0 4px}
  .pagination li:last-child a{border-radius:0 4px 4px 0}
  .pagination a:hover{background:#eee;text-decoration:none}
  .pagination a.on{color:#fff;background:#337ab7;border-color:#337ab7;cursor:default;z-index:2;position:relative}
  .pagination a.dis{color:#bbb;pointer-events:none}
  .more{margin:6px 0 24px;text-align:center}

  /* ---- progress (loading) ---- */
  .progress{height:20px;margin:40px auto 10px;max-width:420px;overflow:hidden;border-radius:4px;
         background-image:linear-gradient(to bottom,#ebebeb 0,#f5f5f5 100%);
         box-shadow:inset 0 1px 2px rgba(0,0,0,.1)}
  .progress-bar{height:100%;width:100%;background-color:#337ab7;
         background-image:linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,
           transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent);
         background-size:40px 40px;animation:stripes 1s linear infinite}
  @keyframes stripes{from{background-position:40px 0}to{background-position:0 0}}

  /* ---- lecture page ---- */
  .player{position:sticky;top:0;z-index:5;padding:8px 12px;margin:0 0 18px;border:1px solid #ccc;
          border-radius:4px;background-image:linear-gradient(to bottom,#fafafa 0,#e6e6e6 100%);
          box-shadow:inset 0 1px 0 #fff,0 2px 6px rgba(0,0,0,.12)}
  .player audio{width:100%;display:block}
  .player .meta{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
  .seg{display:flex;gap:10px;align-items:baseline;padding:3px 6px;border-radius:3px}
  .seg:hover{background:#f5f5f5}
  .seg.now{background:#fcf8e3;box-shadow:inset 3px 0 0 #f0ad4e}
  .seg .ts{min-width:52px;font-size:12px}
  .transcript{max-height:70vh;overflow:auto;padding:6px 8px}

  .flash{animation:fl 2s ease-out}
  @keyframes fl{0%{background:#fcf8e3}100%{background:transparent}}

  footer{color:#777;font-size:12px;padding:19px 0 30px;border-top:1px solid #e5e5e5;margin-top:30px}

  /* ---- small screens ---- */
  @media (max-width:991px){
    .side,.side-r,.row,.vs{grid-template-columns:minmax(0,1fr)!important}
    .cols{column-count:2}
    .tiles{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:640px){
    .navsearch{margin-left:0;width:100%}
    #q{width:100%}
    .nav a{padding:8px 9px;font-size:13px}
    .brand{padding:10px 0 4px}
    .cols{column-count:1}
    .jumbotron{padding:20px}
    .jumbotron h1{font-size:30px}
    .jsearch{flex-direction:column}
    h2{font-size:22px}
  }
</style>
</head>
<body>
<div class="navbar"><div class="container">
  <a class="brand" href="#/"><img src="favicon.svg" alt="">HPI Lecture Corpus</a>
  <ul class="nav" id="nav"></ul>
  <div class="navsearch">
    <label class="sr" for="q">Search</label>
    <input id="q" class="form-control" type="search" placeholder="Search…  ( / )" autocomplete="off">
    <select class="form-control" id="lang" title="Interface language" hidden></select>
  </div>
</div></div>
<div id="notice"></div>

<div class="container">
  <main id="view"><div class="progress"><div class="progress-bar"></div></div>
    <p class="muted" style="text-align:center">Loading the lecture index…</p></main>
  <footer id="foot"></footer>
</div>

<script>
/* ======================================================================
   Strings. Translations exist for the core vocabulary; anything missing
   falls back to English. The language picker only appears when some
   lecture actually carries translations.
   ====================================================================== */
const UI = {
  en:{home:"Home",map:"Map",clusters:"Clusters",search:"Search",pearls:"Pearls",topics:"Topics",speakers:"Speakers",
      episodes:"Lectures",about:"About",no:"No matches.",src:"Source",
      abstract:"Abstract",keyp:"Key teaching points",transcript:"Transcript",
      showq:"show quote",hideq:"hide quote",talks:"lectures",
      mt:"Machine-translated. Verify against the English source."},
  ko:{home:"홈",map:"개념도",clusters:"군집",search:"검색",pearls:"핵심 요점",topics:"주제",speakers:"강연자",episodes:"강의",
      about:"정보",no:"검색 결과가 없습니다.",src:"출처",abstract:"요약",keyp:"핵심 교육 요점",transcript:"전사본",
      showq:"원문 인용 보기",hideq:"인용 숨기기",talks:"개 강의",mt:"기계 번역입니다. 영어 원문을 확인하세요."},
  fr:{home:"Accueil",map:"Carte",clusters:"Groupes",search:"Recherche",pearls:"Perles",topics:"Thèmes",speakers:"Intervenants",
      episodes:"Cours",about:"À propos",no:"Aucun résultat.",src:"Source",abstract:"Résumé",keyp:"Points clés",
      transcript:"Transcription",showq:"voir la citation",hideq:"masquer la citation",talks:"cours",
      mt:"Traduction automatique. Vérifiez la source anglaise."},
  de:{home:"Start",map:"Karte",clusters:"Cluster",search:"Suche",pearls:"Merksätze",topics:"Themen",speakers:"Referenten",
      episodes:"Vorträge",about:"Info",no:"Keine Treffer.",src:"Quelle",abstract:"Zusammenfassung",keyp:"Kernaussagen",
      transcript:"Transkript",showq:"Zitat anzeigen",hideq:"Zitat ausblenden",talks:"Vorträge",
      mt:"Maschinell übersetzt. Bitte mit dem englischen Original abgleichen."}
};
let D=null, LANG="en";
const T=k=>(UI[LANG]||UI.en)[k]||UI.en[k]||k;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc=encodeURIComponent;
const mmss=s=>{s=Math.max(0,Math.floor(+s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,"0");
  return h?`${h}:${String(m).padStart(2,"0")}:${x}`:`${m}:${x}`};
const dur=s=>{const m=Math.round((+s||0)/60);return m>=60?`${Math.floor(m/60)}h ${String(m%60).padStart(2,"0")}m`:`${m}m`};
const num=n=>(+n||0).toLocaleString("en-US");
const fmtDate=t=>t?new Date(t).toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"}):"";
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},
             set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

// Pick translated text when present, else fall back to English.
function tr(obj, field, slug){
  if(LANG==="en") return obj[field];
  const ep=EP[slug||obj.episode||obj.slug];
  const t=ep&&ep.i18n&&ep.i18n[LANG];
  if(!t) return obj[field];
  if(field==="abstract"&&t.abstract) return t.abstract;
  if(field==="key_points"&&t.key_points) return t.key_points;
  if(field==="text"&&t.pearls&&obj.pearl_id&&t.pearls[obj.pearl_id]) return t.pearls[obj.pearl_id];
  return obj[field];
}

/* ======================================================================
   Indexes, built once after data.json loads.
   ====================================================================== */
let EP={}, BYID={}, PBYEP={}, SPK={}, TYPES=[], NEWEST=[];
const TYPE_LBL={practice:"Practice",judgment:"Clinical judgment",pitfall:"Pitfalls",red_flag:"Red flags",
  dx_criteria:"Diagnostic criteria",dosing:"Dosing",exam_technique:"Exam technique",concept:"Concepts",
  procedure:"Procedures",other:"Other"};
const GRADE_CLS={A:"success",B:"primary",C:"default"};
const VERDICT_CLS={conflict:"danger",duplicate:"default",consensus:"success",related:"primary"};
const VERDICT_LBL={conflict:"Conflict",duplicate:"Duplicate",consensus:"Consensus",related:"Related"};

function index(){
  D.episodes.forEach(e=>{e._dt=e.pubDate?Date.parse(e.pubDate)||0:0;e._np=0;EP[e.slug]=e;});
  // The long tail of one-off pearl types the extractor invented is folded into "Other".
  const tc={}; D.pearls.forEach(p=>tc[p.type]=(tc[p.type]||0)+1);
  D.pearls.forEach(p=>{
    p.t=+p.t||0; p.points=+p.points||0;
    p._type=tc[p.type]>=20?p.type:"other";
    p._s=((p.text||"")+" "+(p.verbatim||"")).toLowerCase();
    p._dt=(EP[p.episode]||{})._dt||0;
    BYID[p.pearl_id]=p;
    (PBYEP[p.episode]=PBYEP[p.episode]||[]).push(p);
    if(EP[p.episode]) EP[p.episode]._np++;
  });
  Object.values(PBYEP).forEach(ps=>ps.sort((a,b)=>a.t-b.t));
  const ty={}; D.pearls.forEach(p=>ty[p._type]=(ty[p._type]||0)+1);
  TYPES=Object.entries(ty).sort((a,b)=>(a[0]==="other")-(b[0]==="other")||b[1]-a[1]);
  D.speakers.forEach(s=>{
    const eps=s.episodes.map(x=>EP[x]).filter(Boolean);
    SPK[s.name]={name:s.name,eps,np:eps.reduce((n,e)=>n+e._np,0),
                 latest:Math.max(0,...eps.map(e=>e._dt))};
  });
  NEWEST=[...D.episodes].sort((a,b)=>b._dt-a._dt);
  D.topics.forEach(t=>t._l=t.label.toLowerCase());
}

/* ======================================================================
   Routing. Everything lives in the URL hash, so the back button works and
   any view (down to a second of a lecture) can be bookmarked or shared.
     #/                      home
     #/pearls?type=&grade=   #/clusters?v=   #/map?d=   #/topics?l=&min=
     #/speakers              #/lectures?sort=&dir=&day=   #/about
     #/lecture/<slug>[/<sec>]   #/topic/<slug>   #/speaker/<name>   #/search/<q>
   ====================================================================== */
let R={view:"home",id:"",t:null,q:{}};
function parse(){
  const h=location.hash.replace(/^#\/?/,"");
  const [path,qs]=h.split("?");
  const parts=(path||"").split("/").map(x=>{try{return decodeURIComponent(x)}catch(e){return x}});
  const q={}; new URLSearchParams(qs||"").forEach((v,k)=>q[k]=v);
  return {view:parts[0]||"home",id:parts[1]||"",t:parts[2]!=null&&parts[2]!==""?+parts[2]:null,q};
}
function href(view,params){
  const qs=Object.entries(params||{}).filter(([,v])=>v!==""&&v!=null);
  return `#/${view}`+(qs.length?"?"+qs.map(([k,v])=>`${k}=${enc(v)}`).join("&"):"");
}
const link={
  lecture:(slug,t)=>`#/lecture/${enc(slug)}`+(t!=null?`/${Math.floor(t)}`:""),
  topic:slug=>`#/topic/${enc(slug)}`,
  speaker:name=>`#/speaker/${enc(name)}`,
};

// "Show more" state, reset whenever the route changes.
let LIMIT={}, LASTKEY="";
const OPEN={};
function more(key,step){LIMIT[key]=(LIMIT[key]||step)+step;render(true);}
function lim(key,step){return LIMIT[key]||step;}
function moreBtn(key,shown,total,step){
  return shown<total?`<div class="more"><button class="btn btn-default" onclick="more('${key}',${step})">
    Show ${Math.min(step,total-shown)} more <span class="muted">(${num(shown)} of ${num(total)})</span></button></div>`:"";
}

const NAV=[["home","#/"],["pearls","#/pearls"],["clusters","#/clusters"],["map","#/map"],["topics","#/topics"],
           ["speakers","#/speakers"],["episodes","#/lectures"],["about","#/about"]];
const SECTION={home:"home",pearls:"pearls",clusters:"clusters",map:"map",topics:"topics",topic:"topics",
  speakers:"speakers",speaker:"speakers",lectures:"episodes",lecture:"episodes",about:"about",search:""};

function render(keepScroll){
  if(!D) return;
  R=parse();
  const key=location.hash.split("?")[0]+"?"+(R.view==="search"?"":location.hash.split("?")[1]||"");
  if(key!==LASTKEY){LIMIT={};LASTKEY=key;}
  const cur=SECTION[R.view]??"";
  $("nav").innerHTML=NAV.map(([k,h])=>`<li><a href="${h}" class="${cur===k?"on":""}">${esc(T(k))}</a></li>`).join("");
  const qb=$("q");
  if(R.view==="search"){ if(document.activeElement!==qb) qb.value=R.id; } else if(document.activeElement!==qb) qb.value="";
  const V={home:homeView,pearls:pearlsView,clusters:clustersView,map:mapView,topics:topicsView,topic:topicView,
    speakers:speakersView,speaker:speakerView,lectures:lecturesView,lecture:lectureView,about:aboutView,search:searchView};
  const y=window.scrollY;
  $("view").innerHTML=(V[R.view]||notFound)();
  if(keepScroll===true) window.scrollTo(0,y);
  if(R.view==="lecture") afterLecture();
}
function notFound(){document.title="Not found · HPI Lecture Corpus";
  return `<div class="alert alert-warning" style="margin-top:20px">That page does not exist. <a href="#/">Go home</a>.</div>`;}
function crumbs(...items){
  return `<ol class="breadcrumb"><li><a href="#/">${esc(T("home"))}</a></li>`+items.map((x,i)=>
    i===items.length-1?`<li class="active">${esc(x[0])}</li>`:`<li><a href="${x[1]}">${esc(x[0])}</a></li>`).join("")+`</ol>`;
}
function setTitle(s){document.title=(s?s+" · ":"")+"HPI Lecture Corpus";}

/* ======================================================================
   Shared pieces
   ====================================================================== */
function hl(s,q){
  if(!q) return esc(s);
  const rx=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
  return esc(s).replace(rx,"<mark>$1</mark>");
}
function pearlCard(p,q,opts){
  const ep=EP[p.episode]||{};
  const showLecture=!(opts&&opts.inLecture);
  return `<div class="pearl" id="p-${esc(p.pearl_id)}">
    <span class="label label-${GRADE_CLS[p.grade]||"default"}" title="Rule-based grade (A best)">${esc(p.grade)}</span>
    <span class="label label-info">${esc(TYPE_LBL[p._type]||p._type)}</span>
    <div class="txt">${hl(tr(p,"text"),q)}</div>
    <div class="meta">
      <a class="ts" href="${link.lecture(p.episode,p.t)}" onclick="return seekLink(event,'${p.episode}',${p.t})"
         title="Play from here">${mmss(p.t)}</a>
      · <a href="${link.speaker(p.speaker)}">${esc(p.speaker)}</a>
      ${showLecture?`· <a href="${link.lecture(p.episode)}">${esc(ep.title||p.episode)}</a>`:""}
      · <button class="linkish" onclick="tq(this)">${esc(T("showq"))}</button>
    </div>
    <div class="quote">“${hl(p.verbatim,q)}”</div></div>`;
}
function tq(el){const q=el.closest(".pearl").querySelector(".quote");
  q.classList.toggle("show");el.textContent=q.classList.contains("show")?T("hideq"):T("showq");}
function pearlList(ps,key,q,step,opts){
  step=step||25;const n=lim(key,step);
  return ps.slice(0,n).map(p=>pearlCard(p,q,opts)).join("")+moreBtn(key,Math.min(n,ps.length),ps.length,step);
}
function lectureRows(eps,opts){
  opts=opts||{};
  return `<div class="scroll"><table class="table-striped table-hover"><thead><tr>
      <th>Date</th><th>Lecture</th>${opts.noSpeaker?"":"<th>Speaker</th>"}<th class="num">Length</th><th class="num">Pearls</th></tr></thead><tbody>`
    +eps.map(e=>`<tr${opts.hit&&opts.hit(e)?' class="hit"':""}><td class="nw">${esc(fmtDate(e._dt))}</td>
      <td><a href="${link.lecture(e.slug)}">${opts.q?hl(e.title,opts.q):esc(e.title)}</a></td>
      ${opts.noSpeaker?"":`<td><a href="${link.speaker(e.speaker)}">${esc(e.speaker)}</a></td>`}
      <td class="num">${dur(e.duration_sec)}</td><td class="num">${e._np}</td></tr>`).join("")
    +`</tbody></table></div>`;
}
function btnGroup(items,cur,mk){
  return `<div class="btn-group">`+items.map(([v,l])=>
    `<a class="btn btn-default btn-sm${String(cur)===String(v)?" on":""}" href="${mk(v)}">${l}</a>`).join("")+`</div>`;
}

    <div class="toolbar">${btnGroup([["","All "+all.length],...["conflict","duplicate","consensus","related"]
      .filter(x=>cnt[x]).map(x=>[x,`${VERDICT_LBL[x]} ${cnt[x]}`])],v,x=>href("clusters",{v:x}))}</div>

// Conflicting pairs are shown side by side under the judge's reason, so it is clear
// exactly which two statements disagree; the rest of the group follows.
function clusterBody(c,ps,confl){
  const used=new Set();
  const pairs=confl.map(r=>{const a=BYID[r.a],b=BYID[r.b]; if(!a||!b) return "";
    used.add(r.a);used.add(r.b);
    return `<div class="alert alert-danger" style="padding:8px 12px;font-size:13px;margin-bottom:8px">
        <b>Why these conflict:</b> ${esc(r.why)}</div><div class="vs">${pearlCard(a)}${pearlCard(b)}</div>`;}).join("");
  const rest=ps.filter(p=>!used.has(p.pearl_id));
  return pairs+(rest.length?(pairs?`<h5 class="sub">Also in this group</h5>`:"")+rest.map(p=>pearlCard(p)).join(""):"");
}

function topicView(){
  const t=D.topics.find(x=>x.slug===R.id); if(!t) return notFound();
  setTitle(t.label);
  const eps=t.episodes.map(s=>EP[s]).filter(Boolean).sort((a,b)=>b._dt-a._dt);
  const q=t._l.length>3?t._l:"";

  return fetch(`ep/${slug}.json`).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>(EPC[slug]=d));
}

      <div><h3 style="margin-top:0">${esc(T("transcript"))}
          <small><button class="linkish" onclick="toNow()">jump to playing</button></small></h3>

function playerAt(t,play){
  const a=$("player"); if(!a) return;
  const go=()=>{a.currentTime=t; if(play) a.play().catch(()=>{});};
  if(a.readyState>=1) go();
  else { a.addEventListener("loadedmetadata",go,{once:true}); a.preload="metadata"; a.load(); }
  markSeg(t,true);
}
function seekLink(ev,slug,t){
  if(ev&&(ev.metaKey||ev.ctrlKey||ev.shiftKey||ev.button===1)) return true;   // let new-tab clicks through
  if(R.view==="lecture"&&R.id===slug){
    history.replaceState(null,"",link.lecture(slug,t)); R.t=t; playerAt(t,true); return false;
  }
  PENDING_PLAY=true; return true;
}
let SEGT=[];
function afterLecture(){
  const a=$("player"); if(!a) return;
  SEGT=[...document.querySelectorAll("#tx .seg")].map(x=>+x.dataset.t);
  // While loading, the element reports 0:00; ignore that so a seek's highlight sticks.
  a.ontimeupdate=()=>{if(a.paused&&a.currentTime===0) return;
    markSeg(a.currentTime,false);
    const n=$("nowat"); if(n) n.textContent=(a.paused?"Paused at ":"Playing at ")+mmss(a.currentTime);};
  if(R.t!=null){
    if(PENDING_PLAY||!a.paused) playerAt(R.t,true);
    else{ markSeg(R.t,true); const n=$("nowat"); if(n) n.textContent="Press play to start at "+mmss(R.t);
          a.addEventListener("play",function once(){a.removeEventListener("play",once);
            if(a.currentTime<1&&R.t) a.currentTime=R.t;});}
  }
  PENDING_PLAY=false;
}
let NOWSEG=-1;
function markSeg(t,scroll){
  if(!SEGT.length) return;
  let lo=0,hi=SEGT.length-1,i=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(SEGT[m]<=t+0.3){i=m;lo=m+1}else hi=m-1;}
  if(i===NOWSEG&&!scroll) return;
  const old=$("s"+NOWSEG); if(old) old.classList.remove("now");
  NOWSEG=i; const el=$("s"+i); if(!el) return;
  el.classList.add("now");
  if(scroll){const box=$("tx"); box.scrollTop=el.offsetTop-box.offsetTop-box.clientHeight/3;}
}
function toNow(){const a=$("player"); markSeg(a?a.currentTime:0,true);}
function copyAt(){
  const a=$("player"); const t=a&&a.currentTime?a.currentTime:(R.t||0);
  const url=location.href.split("#")[0]+link.lecture(R.id,t);
  const done=()=>{const n=$("nowat"); if(n) n.textContent="Link copied ("+mmss(t)+")";};
  if(navigator.clipboard) navigator.clipboard.writeText(url).then(done,()=>prompt("Copy this link:",url));
  else prompt("Copy this link:",url);
}

    ${row("2 · Transcribe","Deepgram <code>nova-3-medical</code>, a clinically-tuned model, with word-level timestamps and speaker diarization. Word timings are what make every pearl deep-linkable.")}
    ${row("3 · Repair","ASR still mangles drug names. A language model proposes corrections but never rewrites the text: it returns a list of replacements, applied deterministically with word-boundary matching, a minimum token length and a per-fix hit ceiling. The raw transcript is always retained, and every applied and rejected fix is logged below.")}
    ${row("4 · Enrich","A language model extracts an abstract, key points, topics and candidate pearls, and must quote the exact transcript span each pearl came from.")}
    ${row("5 · Anchor","Each pearl's quoted span is located in the word-timed transcript: exact match first, then a bounded fuzzy search. A pearl whose source cannot be located is <b>dropped</b>, never shown with a guessed timestamp.")}
    ${row("6 · Grade","Pure rules, no model. Five signals: specific, actionable, harm, non-obvious, plus an institution-local <b>veto</b> that forces grade D. Reproducible by construction; an earlier model-based grader was discarded after scoring only 53% agreement with itself. Grade D is excluded from this site.")}

  if(ps.length) out.push(`<h3>${esc(T("pearls"))} <small class="muted">(${num(ps.length)})</small></h3>`+pearlList(ps,"sp",q,20));
  if(th.length) out.push(`<h3>${esc(T("transcript"))} <small class="muted">(${num(th.length)})</small></h3>`
    +th.slice(0,lim("st",30)).map(x=>{const e=EP[x.slug]||{};
      return `<div class="pearl"><div>${hl(x.s.text,q)}</div><div class="meta">
        <a class="ts" href="${link.lecture(x.slug,x.s.t)}" onclick="return seekLink(event,'${x.slug}',${x.s.t})">${mmss(x.s.t)}</a>
        · <a href="${link.lecture(x.slug)}">${esc(e.title||x.slug)}</a></div></div>`;}).join("")
    +moreBtn("st",Math.min(lim("st",30),th.length),th.length,50));
  if(nload>0) out.push(`<div class="alert alert-info">Full-text transcript search covers the ${Object.keys(EPC).length}
    of ${D.episodes.length} lectures loaded so far. ${loadAllBtn()}</div>`);
  if(!ts.length&&!eps.length&&!ps.length&&!th.length) out.push(`<p class="muted">${esc(T("no"))}</p>`);
  return out.join("");
}

/* ======================================================================
   Search box, keyboard, notice, boot
   ====================================================================== */
let BEFORE_SEARCH="#/", STIMER=null;
function goSearch(q){
  q=(q||"").trim();
  if(!q){ if(R.view==="search") location.hash=BEFORE_SEARCH; return; }
  const h="#/search/"+enc(q);
  if(R.view==="search"){ history.replaceState(null,"",h); render(); }
  else { BEFORE_SEARCH=location.hash||"#/"; location.hash=h; }
}
$("q").addEventListener("input",e=>{clearTimeout(STIMER);const v=e.target.value;STIMER=setTimeout(()=>goSearch(v),180);});
$("q").addEventListener("keydown",e=>{
  if(e.key==="Escape"){e.target.value="";goSearch("");e.target.blur();}
  if(e.key==="Enter"){clearTimeout(STIMER);goSearch(e.target.value);}
});
document.addEventListener("keydown",e=>{
  const t=e.target.tagName;
  if(e.key==="/"&&t!=="INPUT"&&t!=="TEXTAREA"&&t!=="SELECT"){e.preventDefault();$("q").focus();$("q").select();}
});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0);});

function notice(){
  if(store.get("hpi-notice")==="1"){$("notice").innerHTML="";return;}
  $("notice").innerHTML=`<div class="alert alert-danger notice"><div class="container">
    <button class="close" aria-label="Dismiss" onclick="store.set('hpi-notice','1');notice()">×</button>
    <b>Study aid, not a clinical reference.</b> Machine-transcribed lectures; verify doses at the source.</div></div>`;
}

fetch("data.json").then(r=>{if(!r.ok)throw new Error("data.json: HTTP "+r.status);return r.json()}).then(d=>{
  D=d; index();
  const s=d.stats;
  const newest=NEWEST[0];
  $("foot").innerHTML=`Hope Partnerships International lecture archive · ${num(s.n_episodes)} lectures · ${num(s.n_pearls)} pearls
     ${newest?`· newest lecture ${esc(fmtDate(newest._dt))}`:""}
     · <a href="https://hopepartners.podbean.com/" target="_blank" rel="noopener">original feed ↗</a>
     · press <kbd>/</kbd> to search`;
  // Only offer languages when some lecture actually carries translations.
  if(d.episodes.some(e=>e.i18n&&Object.keys(e.i18n).length)){
    const sel=$("lang"); sel.hidden=false;
    sel.innerHTML=Object.entries(d.langs).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
    sel.onchange=()=>{LANG=sel.value;render(true)};
  }
  notice();
  render();
}).catch(e=>{$("view").innerHTML=
  `<div class="alert alert-danger" style="margin-top:20px"><b>The lecture index failed to load.</b> ${esc(e&&e.message||String(e))}.
   Try reloading the page.</div>`});
</script>
