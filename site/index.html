<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HPI Lecture Corpus</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="theme-color" content="#f8f8f8">
<meta name="description" content="Searchable, cross-linked archive of Hope Partnerships International residency lectures.">
<style>
  /* Bootstrap 3 (2015) chrome, hand-written. The tells that actually date a page
     are vertical gradients, inset white highlights, 4px radii and dense spacing.
     A flat, airy layout reads 2017+ no matter what the palette is. */
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:#333;
       font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
       font-size:14px;line-height:1.428571429}
  a{color:#337ab7;text-decoration:none}
  a:hover,a:focus{color:#23527c;text-decoration:underline}
  .wrap{max-width:1170px;margin:0 auto;padding:0 15px}

  /* navbar-default: gradient + inset highlight */
  header{background-image:linear-gradient(to bottom,#fff 0,#f8f8f8 100%);
         background-repeat:repeat-x;border-bottom:1px solid #e7e7e7;
         box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 1px 5px rgba(0,0,0,.075);
         margin-bottom:18px}
  .htop{display:flex;align-items:center;gap:12px;padding:11px 0;flex-wrap:wrap}
  h1{font-size:18px;margin:0;font-weight:500;color:#777;line-height:20px}
  h2{font-size:24px;font-weight:500;margin:0 0 10px}
  h3{font-size:18px;font-weight:500;margin:18px 0 9px}
  .stats{color:#777;font-size:12px;margin-left:auto;text-align:right}

  /* nav-tabs: folder tabs that merge into the content edge */
  nav{border-bottom:1px solid #ddd;display:flex;flex-wrap:wrap;margin-bottom:16px}
  nav button{background:none;border:1px solid transparent;border-radius:4px 4px 0 0;
             padding:10px 15px;margin-bottom:-1px;cursor:pointer;
             font:inherit;line-height:1.428571429;color:#337ab7}
  nav button:hover{background:#eee;border-color:#eee #eee #ddd;text-decoration:underline}
  nav button.on{color:#555;background:#fff;border:1px solid #ddd;border-bottom-color:transparent;
                cursor:default;text-decoration:none}

  /* panels */
  .card{background:#fff;border:1px solid #ddd;border-radius:4px;
        box-shadow:0 1px 1px rgba(0,0,0,.05);padding:15px;margin-bottom:18px}
  .phead{background-image:linear-gradient(to bottom,#f5f5f5 0,#e8e8e8 100%);
         background-repeat:repeat-x;border-bottom:1px solid #ddd;
         padding:10px 15px;cursor:pointer;user-select:none;
         display:flex;align-items:center;gap:8px;color:#333}
  .phead:hover{background-image:linear-gradient(to bottom,#e8e8e8 0,#dcdcdc 100%)}

  /* well: the inset gray box, very 2015 */
  #q{width:100%;height:34px;padding:6px 12px;font-size:14px;line-height:1.428571429;
     color:#555;background:#fff;border:1px solid #ccc;border-radius:4px;
     box-shadow:inset 0 1px 1px rgba(0,0,0,.075);
     transition:border-color .15s ease-in-out,box-shadow .15s ease-in-out;
     margin:0 0 12px;font-family:inherit}
  #q:focus{border-color:#66afe9;outline:0;
           box-shadow:inset 0 1px 1px rgba(0,0,0,.075),0 0 8px rgba(102,175,233,.6)}

  /* labels and badges */
  .chip{display:inline-block;background:#777;color:#fff;border-radius:10px;
        padding:3px 7px;font-size:12px;font-weight:700;line-height:1;
        margin:2px 4px 2px 0;white-space:nowrap;vertical-align:baseline}
  .chip.t{cursor:pointer;background:#337ab7}
  .chip.t:hover{background:#23527c}
  .type{background:#337ab7;color:#fff;border-radius:.25em;padding:.2em .6em .3em;
        font-size:75%;font-weight:700;text-transform:uppercase}
  .meta{color:#777;font-size:12px;margin-top:6px}
  .ts{font-weight:700;cursor:pointer;color:#337ab7}
  .ts:hover{text-decoration:underline}
  .muted{color:#777} .small{font-size:12px}

  /* alert-warning */
  .banner{background:#fcf8e3;border:1px solid #faebcc;color:#8a6d3b;
          border-radius:4px;padding:15px;margin:0 0 18px}
  .banner a{color:#66512c;font-weight:700;text-decoration:underline}

  .quote{border-left:5px solid #eee;padding:10px 20px;margin:10px 0 0;
         color:#777;font-size:13px;font-style:italic;display:none}
  .quote.show{display:block}
  .toggle{font-size:12px;color:#337ab7;cursor:pointer}
  .toggle:hover{text-decoration:underline}

  .grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .seg{padding:2px 0;display:flex;gap:10px;align-items:baseline}
  .seg:hover{background:#f5f5f5}
  mark{background:#fcf8e3;padding:.2em 0}

  select,.lang{height:34px;padding:6px 12px;font-size:14px;color:#555;
        background-image:linear-gradient(to bottom,#fff 0,#e0e0e0 100%);
        background-repeat:repeat-x;border:1px solid #ccc;border-radius:4px;
        text-shadow:0 1px 0 #fff;font-family:inherit;cursor:pointer}
  audio{width:100%;margin-top:10px}
  footer{color:#777;font-size:12px;padding:19px 0;border-top:1px solid #e5e5e5;margin-top:30px}

  /* table-striped */
  table{width:100%;max-width:100%;border-collapse:collapse;margin-bottom:18px;font-size:13px}
  th{text-align:left;padding:8px;border-bottom:2px solid #ddd;vertical-align:bottom}
  td{padding:8px;border-top:1px solid #ddd;vertical-align:top}
  tbody tr:nth-child(odd){background:#f9f9f9}
  tbody tr:hover{background:#f5f5f5}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

  /* calendar */
  .cal{width:100%;max-width:430px;border:1px solid #ddd;border-radius:4px;
       margin-bottom:15px;font-size:13px}
  .cal th{background-image:linear-gradient(to bottom,#f5f5f5 0,#e8e8e8 100%);
          text-align:center;padding:6px;border-bottom:1px solid #ddd;
          font-size:12px;color:#777;font-weight:700}
  .cal td{text-align:center;padding:6px;border-top:1px solid #eee;width:14.28%}
  .cal td.nil{color:#ccc;background:none}
  .cal td.has{background:#f5f5f5;font-weight:700}
  .cal td.has a{display:block}
  .flash{animation:fl 1.6s ease-out}
  @keyframes fl{0%{background:#fcf8e3}100%{background:transparent}}

  @media (max-width:640px){
    .stats{width:100%;text-align:left;margin-left:0}
    nav button{padding:8px 11px;font-size:13px}
    .card{padding:12px}
  }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="htop">
    <h1>HPI Lecture Corpus <span id="sub"></span></h1>
    <select class="lang" id="lang" title="Interface language"></select>
    <div class="stats" id="stats"></div>
  </div>
</div></header>

<div class="wrap">
  <nav id="nav" class="tabs"></nav>
  <input id="q" placeholder="Search transcripts, pearls, topics…" autocomplete="off">
  <div id="hint" class="muted small" style="margin-bottom:14px"></div>
  <main id="view"></main>
  <footer id="foot"></footer>
</div>

<script>
const UI = {
  en:{map:"Map",clusters:"Clusters",search:"Search",pearls:"Pearls",topics:"Topics",speakers:"Speakers",episodes:"Episodes",
      archive:"Archive",arch_h:"All lectures, newest first. Click a highlighted day to jump to it.",
      about:"About",hits:"results",no:"No matches.",listen:"Listen at",src:"Source",
      abstract:"Abstract",keyp:"Key teaching points",transcript:"Transcript",
      showq:"show source quote",hideq:"hide source quote",talks:"lectures",
      mt:"Machine-translated. Verify against the English source.",
      ph:"Search transcripts, pearls, topics…"},
  ko:{map:"개념도",clusters:"군집",search:"검색",pearls:"핵심 요점",topics:"주제",speakers:"강연자",episodes:"강의",
      archive:"보관함",arch_h:"전체 강의 · 최신순. 표시된 날짜를 누르면 해당 강의로 이동합니다.",
      about:"정보",hits:"건",no:"검색 결과가 없습니다.",listen:"재생 위치",src:"출처",
      abstract:"요약",keyp:"핵심 교육 요점",transcript:"전사본",
      showq:"원문 인용 보기",hideq:"인용 숨기기",talks:"개 강의",
      mt:"기계 번역입니다. 영어 원문을 확인하세요.",ph:"전사본, 요점, 주제 검색…"},
  fr:{map:"Carte",clusters:"Groupes",search:"Recherche",pearls:"Perles",topics:"Thèmes",speakers:"Intervenants",episodes:"Cours",
      archive:"Archives",arch_h:"Tous les cours, du plus récent au plus ancien. Cliquez sur un jour surligné pour y aller.",
      about:"À propos",hits:"résultats",no:"Aucun résultat.",listen:"Écouter à",src:"Source",
      abstract:"Résumé",keyp:"Points clés",transcript:"Transcription",
      showq:"voir la citation",hideq:"masquer la citation",talks:"cours",
      mt:"Traduction automatique. Vérifiez la source anglaise.",
      ph:"Rechercher transcriptions, perles, thèmes…"},
  de:{map:"Karte",clusters:"Cluster",search:"Suche",pearls:"Merksätze",topics:"Themen",speakers:"Referenten",episodes:"Vorträge",
      archive:"Archiv",arch_h:"Alle Vorträge, neueste zuerst. Klicken Sie auf einen markierten Tag, um dorthin zu springen.",
      about:"Info",hits:"Treffer",no:"Keine Treffer.",listen:"Anhören bei",src:"Quelle",
      abstract:"Zusammenfassung",keyp:"Kernaussagen",transcript:"Transkript",
      showq:"Zitat anzeigen",hideq:"Zitat ausblenden",talks:"Vorträge",
      mt:"Maschinell übersetzt. Bitte mit dem englischen Original abgleichen.",
      ph:"Transkripte, Merksätze, Themen durchsuchen…"}
};
let D=null, LANG="en", TAB="pearls", SEL=null;
const OPEN={};
function togS(t){OPEN[t]=!OPEN[t];render();}
const T=k=>(UI[LANG]||UI.en)[k]||UI.en[k];
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const AUDIO=(sl)=>`../data/audio/${sl}.m4a`;

// Pick translated text when present, else fall back to English.
function tr(obj, field, slug){
  if(LANG==="en") return obj[field];
  const ep=D.episodes.find(e=>e.slug===(slug||obj.episode||obj.slug));
  const t=ep&&ep.i18n&&ep.i18n[LANG];
  if(!t) return obj[field];
  if(field==="abstract"&&t.abstract) return t.abstract;
  if(field==="key_points"&&t.key_points) return t.key_points;
  if(field==="text"&&t.pearls&&obj.pearl_id&&t.pearls[obj.pearl_id]) return t.pearls[obj.pearl_id];
  return obj[field];
}

function render(){
  document.getElementById("q").placeholder=T("ph");
  const nav=document.getElementById("nav");
  nav.innerHTML=["pearls","clusters","map","topics","speakers","episodes","archive","about"]
    .map(t=>`<button data-t="${t}" class="${TAB===t?'on':''}">${T(t)}</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;SEL=null;render()});
  const q=document.getElementById("q").value.trim();
  const v=document.getElementById("view");
  document.getElementById("hint").textContent="";
  if(q) return v.innerHTML=searchView(q);
  if(SEL&&SEL.kind==="episode") return v.innerHTML=episodeView(SEL.id);
  if(SEL&&SEL.kind==="topic")   return v.innerHTML=topicView(SEL.id);
  if(SEL&&SEL.kind==="speaker") return v.innerHTML=speakerView(SEL.id);
  v.innerHTML=({pearls:pearlsView,clusters:clustersView,map:mapView,topics:topicsView,
                speakers:speakersView,episodes:episodesView,archive:archiveView,about:aboutView})[TAB]();
}

function pearlCard(p){
  const ep=D.episodes.find(e=>e.slug===p.episode)||{};
  const gc={A:"#5cb85c",B:"#337ab7",C:"#999"}[p.grade]||"#999";
  return `<div class="card">
    <span class="chip type">${esc(p.type)}</span>
    <span class="chip" style="background:${gc};color:#fff;font-weight:600" title="deterministic rule score">${esc(p.grade||"")}</span>
    <div style="margin-top:7px">${esc(tr(p,"text"))}</div>
    <div class="meta">
      <b>${esc(p.speaker)}</b> · <a href="#" onclick="go('episode','${p.episode}');return false">${esc(ep.title||p.episode)}</a>
      · <span class="ts" onclick="seek('${p.episode}',${p.t})">${mmss(p.t)}</span>
      · <a href="${esc(ep.link||'#')}" target="_blank" rel="noopener">${T("src")} ↗</a>
      · <span class="toggle" onclick="tq(this)">${T("showq")}</span>
    </div>
    <div class="quote">“${esc(p.verbatim)}”</div></div>`;
}
function tq(el){const q=el.closest(".card").querySelector(".quote");
  q.classList.toggle("show");el.textContent=q.classList.contains("show")?T("hideq"):T("showq")}

function pearlsView(){
  // Collapsed by default: with ~4900 pearls the flat list buried the fact that
  // there are distinct kinds. Headers show the categories at a glance; a section
  // renders its cards only once opened, which also keeps the DOM small.
  const by={};D.pearls.forEach(p=>(by[p.type]=by[p.type]||[]).push(p));
  const order=Object.entries(by).sort((a,b)=>b[1].length-a[1].length);
  const LBL={dosing:"Dosing",pitfall:"Pitfalls",red_flag:"Red flags",
             exam_technique:"Exam technique",dx_criteria:"Diagnostic criteria",
             practice:"Practice",judgment:"Clinical judgment"};
  return `<div class="banner">${D.pearls.length} pearls in ${order.length} categories. Click a category to open it. Graded A-C by rule; D-grade excluded.</div>`
   +order.map(([t,ps])=>{
     const open=!!OPEN[t];
     const best=ps.filter(p=>p.grade==="A").length;
     return `<div class="card" style="padding:0;overflow:hidden">
       <div onclick="togS('${t}')" class="phead">
         <span style="font-size:13px;width:12px;color:var(--muted)">${open?"▾":"▸"}</span>
         <b>${esc(LBL[t]||t)}</b>
         <span class="chip">${ps.length}</span>
         ${best?`<span class="chip" style="background:#5cb85c;color:#fff">${best} A</span>`:""}
       </div>
       ${open?`<div style="padding:0 12px 12px">${ps.map(pearlCard).join("")}</div>`:""}
     </div>`;}).join("");
}
function clustersView(){
  const cs=(D.clusters||[]).filter(c=>c.size>1);
  if(!cs.length) return `<div class="banner">No clusters yet.</div>`;
  const byId={}; D.pearls.forEach(p=>byId[p.pearl_id]=p);
  const VC={conflict:"#d9534f",duplicate:"#777",consensus:"#5cb85c",related:"#337ab7"};
  const nconf=cs.filter(c=>c.verdict==="conflict").length;
  const rows=cs.map((c,i)=>{
    const open=!!OPEN["c"+i];
    const ps=c.pearl_ids.map(id=>byId[id]).filter(Boolean);
    return `<div class="card" style="padding:0;overflow:hidden">
      <div onclick="togS('c${i}')" class="phead" style="font-size:13.5px">
        <span style="width:10px;color:var(--muted)">${open?"▾":"▸"}</span>
        <span class="chip" style="background:${VC[c.verdict]};color:#fff;font-weight:700;
              min-width:74px;text-align:center">${c.verdict}</span>
        <b style="flex:1">${esc(c.label)}</b>
        <span class="chip">${c.size}</span>
        <span class="chip" style="max-width:190px;overflow:hidden;text-overflow:ellipsis"
              >${esc(c.speakers.join(", "))}</span>
      </div>
      ${open?`<div style="padding:0 12px 12px">${ps.map(pearlCard).join("")}</div>`:""}
    </div>`;}).join("");
  return `<div class="banner"><b>${cs.length}</b> groups of pearls that say nearly the same
      thing. <b>${nconf}</b> contain a contradiction. Grouped by embedding similarity, then
      each close pair judged. Labels are the vocabulary the pearls share.</div>${rows}`;
}

// Concept map. Layout is precomputed at build time (scripts/build_graph.py) so the
// page never runs a force simulation -- it is instant, and identical for everyone.
let G=null, GDOM=null;
function mapView(){
  if(!G){ fetch("graph.json").then(r=>r.json()).then(g=>{G=g;render();});
          return `<p class="muted">loading concept map…</p>`; }
  const shown=G.nodes.filter(n=>!GDOM||n.domain===GDOM);
  const ids=new Set(shown.map(n=>n.id));
  const links=G.links.filter(l=>ids.has(l.s)&&ids.has(l.t));
  const pos={}; G.nodes.forEach(n=>pos[n.id]=n);
  const r=n=>Math.max(4,Math.min(26,3.2*Math.sqrt(n.n)));
  const legend=G.domains.map(([d,c])=>
    `<span class="chip t" onclick="setDom('${d.replace(/'/g,"")}')"
      style="background:${G.colors[d]||'#6b7280'};color:#fff;${GDOM&&GDOM!==d?'opacity:.35':''}">${esc(d)} ${c}</span>`).join("");
  return `<div class="banner"><b>${G.nodes.length}</b> concepts taught in ${G.min_episodes}+ lectures.
      Lines join concepts taught together; thicker lines mean more shared lectures.
      Circle size shows how many lectures cover it. Click a concept to open it.</div>
    <div style="margin:10px 0">${legend}
      ${GDOM?`<span class="chip t" onclick="setDom(null)"><b>clear filter</b></span>`:""}</div>
    <div class="card" style="padding:6px;overflow:auto">
    <svg viewBox="0 0 ${G.w} ${G.h}" style="width:100%;height:auto;min-height:420px" role="img">
      <g stroke-linecap="round">
      ${links.map(l=>{const a=pos[l.s],b=pos[l.t];
        const br=l.kind==="branch";
        return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"
          stroke="${br?(a.color||'#888'):'currentColor'}"
          stroke-opacity="${br?0.75:Math.min(0.32,0.06+l.w*0.05)}"
          stroke-width="${br?2.2:Math.min(3,0.5+l.w*0.35)}"/>`;}).join("")}
      </g>
      ${shown.map(n=>`<g style="cursor:pointer" onclick="go('topic','${n.slug}')">
          <title>${esc(n.label)}. ${n.n} lectures (${esc(n.domain)})</title>
          <circle cx="${n.x}" cy="${n.y}" r="${r(n)}" fill="${n.color}"
                  fill-opacity=".85" stroke="var(--panel)" stroke-width="1.5"/>
          ${n.n>=6?`<text x="${n.x}" y="${n.y-r(n)-4}" text-anchor="middle"
             font-size="13" fill="currentColor" opacity=".85">${esc(n.label.slice(0,26))}</text>`:""}
        </g>`).join("")}
    </svg></div>`;
}
function setDom(d){GDOM=d;render();}

function topicsView(){
  return `<div class="grid">`+D.topics.map(t=>
    `<div class="card" style="cursor:pointer" onclick="go('topic','${t.slug}')">
      <b>${esc(t.label)}</b><div class="meta">${t.episodes.length} ${T("talks")} · ${esc(t.kind)}</div>
     </div>`).join("")+`</div>`;
}
function topicView(slug){
  const t=D.topics.find(x=>x.slug===slug);if(!t)return T("no");
  const eps=t.episodes.map(s=>D.episodes.find(e=>e.slug===s)).filter(Boolean);
  const ps=D.pearls.filter(p=>t.episodes.includes(p.episode));
  return `<h2>${esc(t.label)}</h2><p class="muted small">${eps.length} ${T("talks")} · ${ps.length} ${T("pearls")}</p>`
    +eps.map(e=>`<div class="card"><a href="#" onclick="go('episode','${e.slug}');return false"><b>${esc(e.title)}</b></a>
       <div class="meta">${esc(e.speaker)} · ${esc(e.pubDate||"")}</div></div>`).join("")
    +`<h3 style="margin-top:22px">${T("pearls")}</h3>`+ps.map(pearlCard).join("");
}
function speakersView(){
  return `<div class="grid">`+D.speakers.map(s=>
    `<div class="card" style="cursor:pointer" onclick="go('speaker','${esc(s.name)}')">
      <b>${esc(s.name)}</b><div class="meta">${s.episodes.length} ${T("talks")}</div></div>`).join("")+`</div>`;
}
function speakerView(name){
  const eps=D.episodes.filter(e=>e.speaker===name);
  const ps=D.pearls.filter(p=>p.speaker===name);
  return `<h2>${esc(name)}</h2><p class="muted small">${eps.length} ${T("talks")} · ${ps.length} ${T("pearls")}</p>`
   +eps.map(e=>`<div class="card"><a href="#" onclick="go('episode','${e.slug}');return false"><b>${esc(e.title)}</b></a>
     <div class="meta">${esc(e.pubDate||"")}</div></div>`).join("")
   +ps.map(pearlCard).join("");
}
function episodesView(){
  return D.episodes.map(e=>`<div class="card">
    <a href="#" onclick="go('episode','${e.slug}');return false"><b>${esc(e.title)}</b></a>
    <div class="meta">${esc(e.speaker)} · ${mmss(e.duration_sec)} · ${esc(e.pubDate||"")}
      · <a href="${esc(e.link)}" target="_blank" rel="noopener">${T("src")} ↗</a></div>
    <div class="small" style="margin-top:8px">${esc((tr(e,"abstract",e.slug)||"").slice(0,260))}</div></div>`).join("");
}
// Archive: every lecture sorted by date, with a month calendar for quick jumps.
// pubDate is RFC-2822, which Date parses natively; days are keyed YYYY-MM-DD.
let CAL=null; // {y,m} of the month currently shown in the calendar
const LOC={en:"en-US",ko:"ko-KR",fr:"fr-FR",de:"de-DE"};
function dkey(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")
  +"-"+String(dt.getDate()).padStart(2,"0")}
function calMove(dm,dy){
  let m=CAL.m+dm,y=CAL.y+dy;
  while(m<0){m+=12;y--} while(m>11){m-=12;y++}
  CAL={y,m};render();
}
function jumpDay(k){
  const el=document.getElementById("day-"+k);
  if(!el)return;
  el.scrollIntoView({block:"center"});
  el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1600);
}
function archiveView(){
  const eps=D.episodes.map(e=>({e,dt:e.pubDate?new Date(e.pubDate):null}))
    .sort((a,b)=>(b.dt?+b.dt:0)-(a.dt?+a.dt:0));
  const byDay={};
  eps.forEach(x=>{if(x.dt)(byDay[dkey(x.dt)]=byDay[dkey(x.dt)]||[]).push(x.e)});
  if(!CAL){const n=eps.find(x=>x.dt);CAL=n?{y:n.dt.getFullYear(),m:n.dt.getMonth()}:{y:2025,m:0};}
  const loc=LOC[LANG]||"en-US";
  const first=new Date(CAL.y,CAL.m,1);
  const startDow=(first.getDay()+6)%7; // week starts Monday
  const ndays=new Date(CAL.y,CAL.m+1,0).getDate();
  const dows=[...Array(7)].map((_,i)=>new Date(2024,0,1+i) // 2024-01-01 was a Monday
    .toLocaleString(loc,{weekday:"short"}));
  let cells="";
  for(let i=0;i<startDow;i++)cells+="<td></td>";
  for(let d=1;d<=ndays;d++){
    const k=CAL.y+"-"+String(CAL.m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const n=(byDay[k]||[]).length;
    cells+=n?`<td class="has"><a href="#" title="${n}" onclick="jumpDay('${k}');return false">${d}</a></td>`
            :`<td class="nil">${d}</td>`;
    if((startDow+d)%7===0)cells+="</tr><tr>";
  }
  const cal=`<div class="card">
    <div class="calhead">
      <button onclick="calMove(0,-1)" title="year">&#171;</button>
      <button onclick="calMove(-1,0)" title="month">&#8249;</button>
      <b>${esc(first.toLocaleString(loc,{month:"long",year:"numeric"}))}</b>
      <button onclick="calMove(1,0)" title="month">&#8250;</button>
      <button onclick="calMove(0,1)" title="year">&#187;</button>
    </div>
    <table class="cal"><tr>${dows.map(d=>`<th>${esc(d)}</th>`).join("")}</tr>
    <tr>${cells}</tr></table></div>`;
  let lastDay="";
  const rows=eps.map(x=>{
    const k=x.dt?dkey(x.dt):"";
    const anchor=(k&&k!==lastDay)?` id="day-${k}"`:"";
    if(k)lastDay=k;
    const date=x.dt?esc(x.e.pubDate.slice(5,16)):". ";
    return `<div class="card ep-row"${anchor}>
      <a href="#" onclick="go('episode','${x.e.slug}');return false"><b>${esc(x.e.title)}</b></a>
      <div class="meta">${date} · ${esc(x.e.speaker)} · ${mmss(x.e.duration_sec)}
        · <a href="${esc(x.e.link)}" target="_blank" rel="noopener">${T("src")} ↗</a></div>
    </div>`;}).join("");
  return `<div class="banner">${D.episodes.length} ${T("talks")}. ${T("arch_h")}</div>`+cal+rows;
}
// Per-episode detail (transcript/segments/vectors) is fetched on demand and
// cached, so the initial load stays small as the corpus grows.
const EPC={};
function loadEp(slug){
  if(EPC[slug]) return Promise.resolve(EPC[slug]);
  return fetch(`ep/${slug}.json`).then(r=>r.json()).then(d=>(EPC[slug]=d));
}
function episodeView(slug){
  const e=D.episodes.find(x=>x.slug===slug);if(!e)return T("no");
  const ps=D.pearls.filter(p=>p.episode===slug);
  const kp=tr(e,"key_points",slug)||[];
  const mt=(LANG!=="en"&&e.i18n&&e.i18n[LANG])?`<div class="banner">${T("mt")}</div>`:"";
  const det=EPC[slug];
  if(!det) loadEp(slug).then(()=>{ if(SEL&&SEL.id===slug) render(); });
  const body=det
    ? det.segments.map(s=>`<div class="seg"><span class="ts" onclick="seek('${slug}',${s.t})">${mmss(s.t)}</span>
        <span>${esc(s.text)}</span></div>`).join("")
    : `<span class="muted">…</span>`;
  return `<h2>${esc(e.title)}</h2>
    <p class="muted small">${esc(e.speaker)} · ${mmss(e.duration_sec)} · ${esc(e.pubDate||"")}
      · <a href="${esc(e.link)}" target="_blank" rel="noopener">${T("src")} ↗</a></p>
    ${mt}
    <audio id="au-${slug}" controls preload="none" src="${AUDIO(slug)}"></audio>
    <div class="card"><b>${T("abstract")}</b><p>${esc(tr(e,"abstract",slug))}</p>
      <b>${T("keyp")}</b><ul>${kp.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>
    <h3>${T("pearls")} <span class="muted small">(${ps.length})</span></h3>${ps.map(pearlCard).join("")}
    <h3>${T("transcript")}</h3><div class="card">${body}</div>`;
}
function aboutView(){
  const e=D.episodes[0]||{}; const s=D.stats;
  const row=(a,b)=>`<tr><td style="white-space:nowrap"><b>${a}</b></td><td>${b}</td></tr>`;
  return `
  <div class="banner"><b>Unverified teaching material.</b> Transcripts are machine-generated
    and machine-corrected, and pearls are machine-extracted. Every pearl links to the exact
    second it was spoken. Verify doses and numbers against the source audio before acting
    on them. This is a study aid, not a clinical reference.</div>

  <div class="card"><b>What this is</b>
    <p>${s.n_episodes} lectures (${s.hours} hours, ${s.words.toLocaleString()} words) from the
    Hope Partnerships International residency lecture series, transcribed and cross-linked so
    they can be searched, compared and cited. Lectures are public and the speaking physicians
    consent to publication.
    <a href="https://hopepartners.podbean.com/" target="_blank" rel="noopener">Original feed ↗</a></p></div>

  <div class="card"><b>How it was built</b>
   <div class="scroll"><table>
    ${row("1 · Fetch","The public RSS feed is polled and each episode keyed on its GUID, which is stable across re-uploads. Audio is extracted from the source video with ffmpeg to 24 kbps mono; the video is deleted immediately, so no media is retained beyond the audio track.")}
    ${row("2 · Transcribe","Deepgram <code>nova-3-medical</code>, a clinically-tuned model, with word-level timestamps, speaker diarization and keyterm boosting on drug names. Word timings are what make every pearl deep-linkable.")}
    ${row("3 · Repair","ASR still mangles drug names. A language model proposes corrections but never rewrites the text: it returns a list of replacements, applied deterministically with word-boundary matching, a minimum token length and a per-fix hit ceiling. The raw transcript is always retained, and every applied and rejected fix is logged below.")}
    ${row("4 · Enrich","A language model extracts an abstract, key points, topics and candidate pearls, and must quote the exact transcript span each pearl came from.")}
    ${row("5 · Anchor","Each pearl's quoted span is located in the word-timed transcript: exact match first, then a bounded fuzzy search. A pearl whose source cannot be located is <b>dropped</b>, never shown with a guessed timestamp. This is the rule the whole design rests on: no unanchored clinical claim.")}
    ${row("6 · Grade","Pure rules, no model. Five signals: specific, actionable, harm, non-obvious, plus an institution-local <b>veto</b> that forces grade D (medication storage, paging, scheduling, room names). Reproducible by construction rather than by measurement; an earlier model-based grader was discarded after scoring only 53% agreement with itself. Grade D is excluded from this site; C is shown but ranked below A and B.")}
    ${row("7 · Index","Concepts are resolved against <b>MeSH</b>, the US National Library of Medicine vocabulary that indexes PubMed. Domain and hierarchy come from MeSH tree numbers, and each concept keeps a stable MeSH identifier that survives reprocessing. 90% of concepts appearing in three or more lectures resolve; the remainder fall back to a keyword table.")}
    ${row("8 · Cluster","Pearls are embedded and grouped by cosine similarity, then each close pair is judged as duplicate, consensus, complement or conflict, because similarity alone cannot separate “always do X” from “never do X”. Contradictions between attendings are surfaced with both sides kept, attributed and dated, never silently reconciled.")}
    ${row("9 · Publish","A static site with no backend. The index loads once; transcripts load per episode on demand. The concept-map layout is solved at build time, so it is identical for every visitor and the page runs no physics simulation.")}
   </table></div></div>

  <div class="card"><b>Models and vocabulary</b>
   <div class="scroll"><table>
    <tr><th>stage</th><th>used</th></tr>
    <tr><td>transcription</td><td>${esc(e.stt_model||". ")}</td></tr>
    <tr><td>terminology repair, enrichment, clustering</td><td>${esc(e.enrich_model||". ")}</td></tr>
    <tr><td>embeddings</td><td>${esc(e.embed_model||". ")} @ ${e.embed_dims||". "}d</td></tr>
    <tr><td>grading</td><td>deterministic rules. No model</td></tr>
    <tr><td>concept vocabulary</td><td>MeSH 2025 (NLM, public domain)</td></tr>
   </table></div></div>

  <div class="card"><b>Known limitations</b>
   <ul>
    <li>One lecture is missing: its source recording has a degenerate audio track (~1 kbps at the origin) and cannot be transcribed.</li>
    <li>Speaker names come from episode titles and are not yet reconciled, so one physician may appear under more than one name.</li>
    <li>Topic labels are model-generated; most appear in only one lecture, so the concept map shows only those taught in three or more.</li>
    <li>MeSH classifies drugs by chemical class rather than by indication, so medications group under Pharmacology rather than the specialty that prescribes them.</li>
    <li>Pearl grading is lexical. It rewards concrete language and cannot judge whether a claim is clinically correct.</li>
   </ul></div>

  <div class="card"><b>ASR corrections applied</b>
    <p class="small muted">Every terminology repair is logged. The raw transcript is retained,
    so any correction can be audited or reverted.</p>
    <div class="scroll"><table><tr><th>episode</th><th>from</th><th>to</th><th>n</th></tr>
    ${Object.values(EPC).flatMap(det=>(det.fixes||[]).map(f=>
      `<tr><td>${esc(det.slug)}</td><td>${esc(f.from)}</td><td><b>${esc(f.to)}</b></td><td>${f.n}</td></tr>`)).join("")}
    </table></div>
    ${Object.keys(EPC).length<D.episodes.length
      ? `<a href="#" onclick="loadAll();return false">load all episodes to see every correction</a>`:""}</div>
  ${Object.values(EPC).some(d=>(d.fixes_rejected||[]).length)?`<div class="card">
    <b>Corrections rejected as unsafe</b>
    <p class="small muted">Repairs the pipeline refused to apply. Too short to match safely,
    or matching implausibly often (e.g. <code>"d" → "deep vein thrombosis"</code>, which would
    have fired 1500 times).</p>
    <div class="scroll"><table><tr><th>from</th><th>to</th><th>why</th></tr>
    ${Object.values(EPC).flatMap(d=>(d.fixes_rejected||[]).map(f=>
      `<tr><td>${esc(f.from)}</td><td>${esc(f.to)}</td><td>${esc(f.why||"")}</td></tr>`)).join("")}
    </table></div></div>`:""}`;
}
function searchView(q){
  const rx=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
  const hi=s=>esc(s).replace(rx,"<mark>$1</mark>");
  const ps=D.pearls.filter(p=>(p.text+" "+p.verbatim).toLowerCase().includes(q.toLowerCase()));
  const ts=D.topics.filter(t=>t.label.toLowerCase().includes(q.toLowerCase()));
  let out=[];
  if(ts.length) out.push(`<h3>${T("topics")}</h3>`+ts.map(t=>
    `<span class="chip t" onclick="go('topic','${t.slug}')">${esc(t.label)} (${t.episodes.length})</span>`).join(""));
  if(ps.length) out.push(`<h3>${T("pearls")} <span class="muted small">(${ps.length})</span></h3>`+ps.map(pearlCard).join(""));
  // Abstracts and key points live in the index, so they always search instantly.
  const ab=D.episodes.filter(e=>((e.abstract||"")+" "+(e.key_points||[]).join(" "))
      .toLowerCase().includes(q.toLowerCase()));
  if(ab.length) out.push(`<h3>${T("episodes")}</h3>`+ab.map(e=>
    `<div class="card"><a href="#" onclick="go('episode','${e.slug}');return false"><b>${esc(e.title)}</b></a>
     <div class="small" style="margin-top:6px">${hi((e.abstract||"").slice(0,240))}</div></div>`).join(""));

  // Full transcripts are per-episode files. Search whatever is already cached,
  // and let the reader opt in to pulling the rest rather than silently
  // downloading the whole corpus on every keystroke.
  let th=[];
  Object.values(EPC).forEach(det=>{
    const e=D.episodes.find(x=>x.slug===det.slug)||{};
    (det.segments||[]).forEach(s=>{
      if(s.text.toLowerCase().includes(q.toLowerCase()))
        th.push(`<div class="card"><div>${hi(s.text)}</div><div class="meta">
          <a href="#" onclick="go('episode','${e.slug}');return false">${esc(e.title||det.slug)}</a>
          · <span class="ts" onclick="seek('${e.slug}',${s.t})">${mmss(s.t)}</span></div></div>`);
    });
  });
  const nload=D.episodes.length-Object.keys(EPC).length;
  if(th.length) out.push(`<h3>${T("transcript")} <span class="muted small">(${th.length})</span></h3>`+th.slice(0,80).join(""));
  if(nload>0) out.push(`<div class="banner">Full-text search covers ${Object.keys(EPC).length}
    of ${D.episodes.length} transcripts loaded so far.
    <a href="#" onclick="loadAll();return false"><b>Load remaining ${nload}</b></a></div>`);
  return out.length?out.join(""):`<p class="muted">${T("no")}</p>`;
}

function loadAll(){
  Promise.all(D.episodes.map(e=>loadEp(e.slug))).then(render);
}
function go(kind,id){SEL={kind,id};document.getElementById("q").value="";render();window.scrollTo(0,0)}
function seek(slug,t){
  if(!(SEL&&SEL.kind==="episode"&&SEL.id===slug)) go("episode",slug);
  setTimeout(()=>{const a=document.getElementById("au-"+slug);
    if(a){a.currentTime=t;a.play().catch(()=>{});a.scrollIntoView({block:"center"});}},60);
}

fetch("data.json").then(r=>r.json()).then(d=>{
  D=d;
  const s=d.stats;
  document.getElementById("stats").innerHTML=
    `${s.n_episodes} lectures · ${s.hours} h · ${s.n_pearls} pearls · ${s.n_topics} topics`;
  
  const sel=document.getElementById("lang");
  sel.innerHTML=Object.entries(d.langs).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
  sel.onchange=()=>{LANG=sel.value;render()};
  document.getElementById("q").oninput=render;
  document.getElementById("foot").innerHTML=
    `Hope Partnerships International lecture archive · transcripts machine-generated, verify at source ·
     <a href="https://hopepartners.podbean.com/" target="_blank" rel="noopener">original feed ↗</a>`;
  render();
}).catch(e=>{document.getElementById("view").innerHTML=
  `<div class="banner">Failed to start: ${esc(e && e.message || String(e))}</div>`});
</script>
</body></html>
